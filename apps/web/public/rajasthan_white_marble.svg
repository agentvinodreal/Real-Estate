<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Marble Surface Gradient -->
    <linearGradient id="marbleBase" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCFCFD" />
      <stop offset="35%" stop-color="#F1F3F5" />
      <stop offset="70%" stop-color="#FAFAFB" />
      <stop offset="100%" stop-color="#E9ECEF" />
    </linearGradient>

    <!-- Glossy Polished Reflection Overlay -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.6" />
      <stop offset="30%" stop-color="#FFFFFF" stop-opacity="0.1" />
      <stop offset="60%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.3" />
    </linearGradient>

    <!-- Slab Edge Shadow -->
    <filter id="slabShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.15" />
    </filter>

    <!-- Soft Vein Blur -->
    <filter id="veinBlur">
      <feGaussianBlur stdDeviation="1.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="#F8FAFC" />

  <!-- Main Rajasthan White Marble Slab -->
  <g filter="url(#slabShadow)">
    <rect x="60" y="50" width="680" height="500" rx="8" fill="url(#marbleBase)" stroke="#CBD5E1" stroke-width="2" />
  </g>

  <!-- Natural Veining Patterns (Makrana White Marble Style) -->
  <g opacity="0.65" filter="url(#veinBlur)">
    <!-- Primary Flowing Vein 1 -->
    <path d="M 60 180 Q 180 220 280 150 T 480 260 T 640 190 T 740 240" fill="none" stroke="#94A3B8" stroke-width="3.5" stroke-linecap="round" />
    <path d="M 120 200 Q 220 230 310 180 T 450 250" fill="none" stroke="#64748B" stroke-width="1.8" opacity="0.7" />

    <!-- Secondary Organic Vein 2 -->
    <path d="M 110 50 Q 240 180 390 320 T 580 440 T 740 510" fill="none" stroke="#64748B" stroke-width="4" stroke-linecap="round" />
    <path d="M 280 230 Q 360 290 420 370 T 530 460" fill="none" stroke="#94A3B8" stroke-width="2" />

    <!-- Branch Veins -->
    <path d="M 390 320 Q 460 280 540 310" fill="none" stroke="#CBD5E1" stroke-width="2.5" />
    <path d="M 210 170 Q 260 110 320 100" fill="none" stroke="#94A3B8" stroke-width="1.5" />
    <path d="M 480 260 Q 550 210 610 130" fill="none" stroke="#CBD5E1" stroke-width="2" />
    
    <!-- Subtle Golden/Beige Calcite Accent Vein -->
    <path d="M 60 380 Q 200 420 360 380 T 590 490 T 740 430" fill="none" stroke="#D97706" stroke-width="1.2" opacity="0.35" />
    <path d="M 150 400 Q 250 430 330 390" fill="none" stroke="#B45309" stroke-width="0.8" opacity="0.3" />
  </g>

  <!-- Polished High-Gloss Surface Reflection Layer -->
  <rect x="60" y="50" width="680" height="500" rx="8" fill="url(#shine)" pointer-events="none" />

  <!-- Slab Edge Chamfer Highlight -->
  <rect x="62" y="52" width="676" height="496" rx="6" fill="none" stroke="#FFFFFF" stroke-width="1.5" opacity="0.8" />

  <!-- Product Badge Label -->
  <g transform="translate(90, 480)">
    <rect x="0" y="0" width="310" height="44" rx="6" fill="#0F172A" opacity="0.85" />
    <text x="16" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#F8FAFC" letter-spacing="0.5">
      RAJASTHAN WHITE MARBLE SLAB
    </text>
  </g>
</svg>
