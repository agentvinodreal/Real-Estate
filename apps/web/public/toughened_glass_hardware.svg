<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Background Interior Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#1E293B" />
    </linearGradient>

    <!-- Glass Surface Tint Gradient -->
    <linearGradient id="glassTint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.25" />
      <stop offset="40%" stop-color="#0EA5E9" stop-opacity="0.08" />
      <stop offset="70%" stop-color="#38BDF8" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.3" />
    </linearGradient>

    <!-- Glass Reflection Line Gradient -->
    <linearGradient id="glassReflect" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.5" />
      <stop offset="25%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="75%" stop-color="#FFFFFF" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.4" />
    </linearGradient>

    <!-- Stainless Steel Metallic Gradient -->
    <linearGradient id="chromeMetal" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94A3B8" />
      <stop offset="20%" stop-color="#F8FAFC" />
      <stop offset="45%" stop-color="#CBD5E1" />
      <stop offset="70%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Chrome Vertical Handle Gradient -->
    <linearGradient id="handleVert" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#FFFFFF" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Layer -->
  <rect width="800" height="600" fill="url(#bgGrad)" />

  <!-- Grid Pattern overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="450" x2="800" y2="450" />
    <line x1="200" y1="0" x2="200" y2="600" />
    <line x1="400" y1="0" x2="400" y2="600" />
    <line x1="600" y1="0" x2="600" y2="600" />
  </g>

  <!-- Toughened Glass Panel -->
  <g transform="translate(180, 40)">
    <!-- Glass Edge Shadow / Bevel -->
    <rect x="-4" y="-4" width="448" height="528" rx="4" fill="none" stroke="#0284C7" stroke-width="6" opacity="0.6" />

    <!-- Main Glass Body -->
    <rect x="0" y="0" width="440" height="520" rx="2" fill="url(#glassTint)" stroke="#38BDF8" stroke-width="2" />

    <!-- Glass Diagonal Light Reflection Streaks -->
    <polygon points="40,0 180,0 20,520 -120,520" fill="url(#glassReflect)" />
    <polygon points="260,0 340,0 140,520 60,520" fill="url(#glassReflect)" opacity="0.6" />

    <!-- Glass Stamp / Toughened Logo Marker (Bottom Right) -->
    <g transform="translate(350, 480)" opacity="0.5">
      <rect x="0" y="0" width="70" height="24" rx="2" fill="none" stroke="#E0F2FE" stroke-width="1" />
      <text x="35" y="16" font-family="sans-serif" font-size="9" fill="#E0F2FE" text-anchor="middle" font-weight="bold">TEMPERED</text>
    </g>

    <!-- Top Corner Patch Fitting Hinge -->
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="90" height="40" rx="3" fill="url(#chromeMetal)" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="20" r="5" fill="#334155" />
      <circle cx="70" cy="20" r="5" fill="#334155" />
    </g>

    <!-- Bottom Corner Patch Fitting Hinge / Floor Spring Connector -->
    <g transform="translate(20, 460)">
      <rect x="0" y="0" width="90" height="40" rx="3" fill="url(#chromeMetal)" stroke="#475569" stroke-width="1" />
      <circle cx="20" cy="20" r="5" fill="#334155" />
      <circle cx="70" cy="20" r="5" fill="#334155" />
    </g>

    <!-- Stainless Steel Pull Handle & Lockset (Right Side) -->
    <g transform="translate(360, 160)">
      <!-- Top Attachment Stud -->
      <circle cx="20" cy="30" r="14" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="30" r="6" fill="#1E293B" />

      <!-- Bottom Attachment Stud -->
      <circle cx="20" cy="230" r="14" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1.5" />
      <circle cx="20" cy="230" r="6" fill="#1E293B" />

      <!-- Vertical Tubular Door Handle -->
      <rect x="11" y="-20" width="18" height="300" rx="9" fill="url(#handleVert)" stroke="#1E293B" stroke-width="1.5" />

      <!-- Key Lock Cylinder Plate -->
      <g transform="translate(0, 110)">
        <rect x="-10" y="0" width="40" height="40" rx="4" fill="url(#chromeMetal)" stroke="#334155" stroke-width="1" />
        <circle cx="10" cy="20" r="7" fill="#0F172A" />
        <rect x="8" y="20" width="4" height="8" fill="#0F172A" />
      </g>
    </g>
  </g>

  <!-- Product Badge Label -->
  <g transform="translate(90, 510)">
    <rect x="0" y="0" width="370" height="44" rx="6" fill="#0EA5E9" opacity="0.9" />
    <text x="16" y="27" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" letter-spacing="0.5">
      TOUGHENED GLASS &amp; DOOR HARDWARE SET
    </text>
  </g>
</svg>
